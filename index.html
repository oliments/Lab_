let sheetStack = [];

function showSheet(id, title, content, opts) {
  opts = opts || {};
  let old = document.getElementById('sheet-' + id);
  if (old) old.remove();

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'sheet-' + id;
  overlay.innerHTML = `
    <div class="sheet${opts.tall ? ' tall' : ''}${opts.full ? ' full' : ''}">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <span class="sheet-title">${title}</span>
        <button class="close-btn" onclick="closeSheet()">×</button>
      </div>
      ${content}
    </div>
  `;
  overlay.addEventListener('click', e => { if (e.target === overlay) closeSheet(); });
  document.body.appendChild(overlay);
  sheetStack.push(id);
  requestAnimationFrame(() => overlay.classList.add('open'));
}

function closeSheet() {
  const id = sheetStack.pop();
  if (!id) return;
  const el = document.getElementById('sheet-' + id);
  if (!el) return;
  el.classList.remove('open');
  setTimeout(() => el.remove(), 260);
}

// ANALYTICS ENGINE
// ══════════════════════════════════════════════════════

function computeAnalytics(v) {
  const ings = expandIngs(v.ingredients);
  const total = ings.reduce((s, i) => s + (+i.pct || 0), 0);
  if (!ings.length || total === 0) return null;

  // ── Pyramid breakdown ──
  const pyramid = { Top: 0, Heart: 0, Base: 0, Unknown: 0 };
  ings.forEach(ing => {
    const mol = state.molecules.find(m => m.id === ing.molId);
    const lvl = mol?.pyramid || 'Unknown';
    pyramid[lvl] = (pyramid[lvl] || 0) + (+ing.pct || 0);
  });
  const pyrPct = {};
  Object.keys(pyramid).forEach(k => pyrPct[k] = total > 0 ? (pyramid[k] / total * 100) : 0);

  // ── Family breakdown ──
  const famMap = {};
  ings.forEach(ing => {
    const key = ing.family || 'Other';
    famMap[key] = (famMap[key] || 0) + (+ing.pct || 0);
  });
  const famSorted = Object.entries(famMap).sort((a,b) => b[1] - a[1]);

  // ── Longevity score ──
  // Base notes = longest, Top = shortest. Score 0–100
  const baseWeight = pyrPct['Base'] || 0;
  const heartWeight = pyrPct['Heart'] || 0;
  const topWeight = pyrPct['Top'] || 0;
  const longevityScore = Math.min(100, Math.round(
    baseWeight * 0.7 + heartWeight * 0.25 + topWeight * 0.05
  ));
  let longevityLabel = 'Poor';
  if (longevityScore >= 70) longevityLabel = 'Excellent';
  else if (longevityScore >= 45) longevityLabel = 'Good';
  else if (longevityScore >= 25) longevityLabel = 'Moderate';

  // ── Aromatic profile ──
  // Each family maps to profile axes: Freshness, Warmth, Sweetness, Earthiness
  const PROFILE_MAP = {
    Citrus:    { Freshness: 90, Warmth: 10, Sweetness: 20, Earthiness: 5  },
    Aquatic:   { Freshness: 85, Warmth: 5,  Sweetness: 5,  Earthiness: 10 },
    Green:     { Freshness: 70, Warmth: 15, Sweetness: 10, Earthiness: 40 },
    Floral:    { Freshness: 40, Warmth: 30, Sweetness: 60, Earthiness: 10 },
    Fougère:   { Freshness: 50, Warmth: 40, Sweetness: 20, Earthiness: 35 },
    Chypre:    { Freshness: 30, Warmth: 50, Sweetness: 15, Earthiness: 55 },
    Gourmand:  { Freshness: 5,  Warmth: 60, Sweetness: 90, Earthiness: 15 },
    Oriental:  { Freshness: 5,  Warmth: 80, Sweetness: 65, Earthiness: 40 },
    Musk:      { Freshness: 20, Warmth: 55, Sweetness: 35, Earthiness: 30 },
    Woody:     { Freshness: 15, Warmth: 65, Sweetness: 20, Earthiness: 70 },
    Resinous:  { Freshness: 5,  Warmth: 75, Sweetness: 30, Earthiness: 65 },
    Aldehyde:  { Freshness: 55, Warmth: 35, Sweetness: 40, Earthiness: 10 },
  };
  const profile = { Freshness: 0, Warmth: 0, Sweetness: 0, Earthiness: 0 };
  ings.forEach(ing => {
    const fam = ing.family;
    const map = PROFILE_MAP[fam];
    if (!map) return;
    const weight = (+ing.pct || 0) / total;
    Object.keys(profile).forEach(axis => {
      profile[axis] += (map[axis] || 0) * weight;
    });
  });

  // ── IFRA risks ──
  const S = useStrength(v);
  const ifraRisks = IFRA_OFF ? [] : actualContent(v).map(r => {
    const mol = r.mol;
    if (!(+mol?.ifra > 0)) return null;
    const ing = { name: r.name };
    const purePct = r.pure * S / 100;
    const limit = +mol.ifra;
    const status = purePct > limit ? 'over' : purePct > limit * 0.85 ? 'warn' : 'ok';
    return { name: ing.name, purePct, limit, status };
  }).filter(Boolean);

  return { pyrPct, famSorted, total, longevityScore, longevityLabel, profile, ifraRisks };
}

// Used only when the molecule's own "Odor life" field is empty.
const TYPICAL_LIFE = {

  '67634-00-8': 24, '127-41-3': 200, '60-12-8': 36, '106-25-2': 36, '78-70-6': 12,
  '1205-17-0': 200, '67634-15-5': 150, '24851-98-7': 400, '8000-25-7': 4, '106-72-9': 12,
  '470-82-6': 2, '18479-58-8': 10, '5392-40-5': 8, '8007-75-8': 4, '98-55-5': 24,

  '140-11-4': 8, '120-72-9': 300, '928-96-1': 1, '111879-80-2': 400, '7779-50-2': 400,

  '79-77-6': 200, '6413-10-1': 72, '77-53-2': 300, '7212-44-4': 72, '68647-72-3': 2,
};
const PYR_LIFE = { Top: 2, Heart: 24, Base: 200 };
function molLife(m) {
  if (!m) return { h: 24, src: 'guess' };
  if (+m.life > 0) return { h: +m.life, src: 'yours' };
  const cas = String(m.cas || '').trim();
  if (TYPICAL_LIFE[cas]) return { h: TYPICAL_LIFE[cas], src: 'typical' };
  if (PYR_LIFE[m.pyramid]) return { h: PYR_LIFE[m.pyramid], src: 'pyramid' };
  return { h: 24, src: 'guess' };
}

// one row per molecule, after accords and dilutions: pure % in concentrate
function actualContent(v) {
  const m = new Map();
  for (const i of expandIngs(v.ingredients)) {
    const pure = ingPurePct(i);
    const k = i.molId;
    if (m.has(k)) m.get(k).pure += pure;
    else m.set(k, { molId: k, name: i.name, family: i.family, pure, mol: state.molecules.find(x => x.id === k) });
  }
  return [...m.values()].sort((a, b) => b.pure - a.pure);
}

const STAGES = [[0, 'Spray'], [0.25, '15 min'], [1, '1 h'], [4, '4 h'], [12, '12 h'], [24, '24 h']];
function evolution(v) {
  const rows = actualContent(v).filter(r => r.pure > 0);
  if (!rows.length) return null;
  const k = Math.log(20); // after "odor life" hours about 5% is left
  // what you smell grows slower than the amount (≈ square root) and depends on how strong the material is
  const loud = (r, amt) => STRENGTH_FACTOR[molStrength(r.mol).lvl] * Math.sqrt(Math.max(0, amt));
  const start = rows.reduce((s, r) => s + loud(r, r.pure), 0);
  const guessed = rows.filter(r => molLife(r.mol).src !== 'yours' || molStrength(r.mol).src !== 'yours').length;
  const stages = STAGES.map(([t, label]) => {
    const parts = rows.map(r => ({ r, val: loud(r, r.pure * Math.exp(-k * t / molLife(r.mol).h)) })).filter(p => p.val > 0);
    const tot = parts.reduce((s, p) => s + p.val, 0);
    parts.sort((a, b) => b.val - a.val);
    return { label, left: tot / start * 100, parts: parts.map(p => ({ name: p.r.name, fam: p.r.family, share: tot ? p.val / tot * 100 : 0 })) };
  });
  return { stages, guessed, total: rows.length };
}

// cost: molecule price is ₴ per gram of the material as bought; a dilution costs proportionally less
function costInfo(v) {
  const ings = expandIngs(v.ingredients);
  const total = ings.reduce((s, i) => s + (+i.pct || 0), 0) || 1;
  const by = new Map(); const noPrice = new Set(); let perG = 0;
  for (const i of ings) {
    const mol = state.molecules.find(m => m.id === i.molId);
    const price = parseFloat(String(mol?.cost || '').replace(',', '.'));
    if (!(price > 0)) { noPrice.add(i.name); continue; }
    const c = (+i.pct || 0) / total * price * (+i.dilPct || 100) / 100;
    perG += c;
    by.set(i.name, (by.get(i.name) || 0) + c);
  }
  const top = [...by.entries()].sort((a, b) => b[1] - a[1]);
  return { perG, top, noPrice: [...noPrice] };
}

function balanceHints(v, an) {
  const H = [];
  const total = v.ingredients.reduce((s, i) => s + (+i.pct || 0), 0);
  if (v.ingredients.length && Math.abs(total - 100) > 0.05) H.push(['warn', `Total is ${fmtPct(total)}% — it should add up to 100%`]);
  const p = an.pyrPct;
  if ((p.Unknown || 0) > 30) H.push(['info', `${p.Unknown.toFixed(0)}% has no Top/Heart/Base set — fill it in on the molecules for a better read`]);
  else {
    if ((p.Base || 0) < 15) H.push(['warn', `Only ${(p.Base || 0).toFixed(0)}% base — the scent may fade quickly`]);
    if ((p.Top || 0) > 40) H.push(['warn', `Top notes are ${(p.Top).toFixed(0)}% — the opening may flash and disappear`]);
    if ((p.Heart || 0) < 10 && (p.Top || 0) > 0 && (p.Base || 0) > 0) H.push(['info', `Very little heart (${(p.Heart || 0).toFixed(0)}%) — top may jump straight to base`]);
  }
  const big = v.ingredients.filter(i => (+i.pct || 0) / (total || 1) > 0.5);
  big.forEach(i => H.push(['info', `${ingDisplayName(i)} is ${((+i.pct || 0) / (total || 1) * 100).toFixed(0)}% of the formula`]));
  const batch = +v.totalMl || 0;
  if (batch > 0) {
    v.ingredients.forEach(i => {
      const g = batch * (+i.pct || 0) / (total || 1);
      if (g > 0 && g < 0.005) {
        const k = Math.ceil(Math.log10(0.005 / g));
        const sug = Math.max(1, Math.round(100 / Math.pow(10, k)));
        H.push(['warn', `${ingDisplayName(i)}: only ${g.toFixed(4)} g in a ${batch} g batch — hard to weigh; use a ${sug}% dilution or a bigger batch`]);
      }
    });
  }
  const ifraOver = (an.ifraRisks || []).filter(r => r.status === 'over');
  if (ifraOver.length) H.push(['err', `IFRA exceeded at ${strengthLabel(IFRA_S)}: ${ifraOver.map(r => r.name).join(', ')}`]);
  return H;
}

// ── version comparison ──
function openCompareVersions(id, kind, a, b) {
  IFRA_OFF = kind === 'accords';
  const f = (state[kind] || []).find(x => x.id === id);
  if (!f || f.versions.length < 2) return;
  if (a == null) { b = f.activeVersion || 0; a = b > 0 ? b - 1 : 1; }
  const VA = f.versions[a], VB = f.versions[b];
  const key = i => i.accId ? 'a:' + i.accId : 'm:' + i.molId + '|' + (+i.dilPct || 100);
  const map = new Map();
  VA.ingredients.forEach(i => map.set(key(i), { name: ingDisplayName(i), a: +i.pct || 0, b: null }));
  VB.ingredients.forEach(i => { const k = key(i); if (map.has(k)) map.get(k).b = +i.pct || 0; else map.set(k, { name: ingDisplayName(i), a: null, b: +i.pct || 0 }); });
  const rows = [...map.values()].sort((x, y) => Math.max(y.a || 0, y.b || 0) - Math.max(x.a || 0, x.b || 0));
  const SA = finalStrength(VA), SB = finalStrength(VB);
  const anA = computeAnalytics(VA), anB = computeAnalytics(VB);
  const cA = costInfo(VA).perG, cB = costInfo(VB).perG;
  const ifraN = (V, S) => expandIngs(V.ingredients).filter(i => ifraStatus(i, 100, S) === 'over').length;
  const pyr = an => an ? ['Top', 'Heart', 'Base'].map(k => (an.pyrPct[k] || 0).toFixed(0)).join(' / ') : '—';
  const sel = (cur, js) => `<select onchange="${js}">${f.versions.map((ver, i) => `<option value="${i}"${i === cur ? ' selected' : ''}>${esc(ver.name)}</option>`).join('')}</select>`;
  showSheet('compare', 'Compare versions', `
    <div class="form-body" style="gap:10px">
      <div class="field-row-2">
        <div class="field">${sel(a, `openCompareVersions('${id}','${kind}',+this.value,${b})`)}</div>
        <div class="field">${sel(b, `openCompareVersions('${id}','${kind}',${a},+this.value)`)}</div>
      </div>
      <div class="cmp-grid">
        <span></span><b>${esc(VA.name)}</b><b>${esc(VB.name)}</b>
        <span>Top / Heart / Base</span><span>${pyr(anA)}</span><span>${pyr(anB)}</span>
        <span>Cost per g</span><span>${cA ? '₴' + cA.toFixed(2) : '—'}</span><span>${cB ? '₴' + cB.toFixed(2) : '—'}</span>
        ${IFRA_OFF ? '' : `<span>IFRA over</span><span>${ifraN(VA, SA)} at ${SA.toFixed(0)}%</span><span>${ifraN(VB, SB)} at ${SB.toFixed(0)}%</span>`}
        <span>Ingredients</span><span>${VA.ingredients.length}</span><span>${VB.ingredients.length}</span>
      </div>
    </div>
    <div class="cmp-list">
      <div class="cmp-row cmp-head"><span>Material, %</span><span>${esc(VA.name)}</span><span>${esc(VB.name)}</span><span>Δ</span></div>
      ${rows.map(r => { const d = (r.b || 0) - (r.a || 0); const cls = r.a == null ? 'added' : r.b == null ? 'removed' : Math.abs(d) > 0.00005 ? 'changed' : '';
        return `<div class="cmp-row ${cls}"><span>${esc(r.name)}${cls === 'added' ? ' <small>new</small>' : cls === 'removed' ? ' <small>removed</small>' : ''}</span>
          <span>${r.a == null ? '—' : fmtPct(r.a)}</span><span>${r.b == null ? '—' : fmtPct(r.b)}</span>
          <span class="${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${Math.abs(d) < 0.00005 ? '' : (d > 0 ? '+' : '') + fmtPct(d)}</span></div>`; }).join('')}
    </div>
    <div class="form-actions"><button class="btn btn-primary" style="flex:1;justify-content:center" onclick="closeSheet()">Done</button></div>`);
}

function backupJSON() {
  return JSON.stringify({
    version: 3,
    exportedAt: new Date().toISOString(),
    molecules: state.molecules,
    formulas:  state.formulas,
    accords:   state.accords || [],
    visions:   state.visions || [],
    wishlist:  state.wishlist || [],
    notebook:  state.notebook || [],
    extraNotes: extraNotes,
    families:  state.families || [],
  }, null, 2);
}
function backupName() { return `lab-backup-${new Date().toISOString().slice(0,10)}.json`; }
function backupSay(t) { const el = document.getElementById('backup-msg'); if (el) el.innerHTML = t; }

// Save the backup. Inside Claude it goes through Claude's own save prompt;
// on iPhone (Safari / home-screen app) it opens the share sheet → "Save to Files";
// elsewhere it downloads the file.
function exportBackup() {
  const json = backupJSON(), name = backupName();
  if (window.claude && typeof window.claude.use === 'function') {
    backupSay('Opening save…');
    window.claude.use('downloads').then(dl => {
      if (!dl) throw { code: 'unavailable' };
      return dl.save({ filename: name, data: json });
    }).then(() => { markBackedUp(); backupSay('Saved ✓'); })
      .catch(e => backupSay(e && e.code === 'declined' ? 'Not saved' : 'Saving isn’t available here — use “Copy backup text” below'));
    return;
  }
  let file = null;
  try { file = new File([json], name, { type: 'application/json' }); } catch (e) {}
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: name })
      .then(() => { markBackedUp(); backupSay('Saved ✓ — check the place you picked (e.g. Files)'); })
      .catch(e => { if (!e || e.name !== 'AbortError') backupSay('Couldn’t open the share sheet — use “Copy backup text” below'); });
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    markBackedUp(); backupSay('Downloaded ✓ — look in your Downloads folder');
  } catch (e) {
    backupSay('Download isn’t available here — use “Copy backup text” below');
  }
}

function copyBackup() {
  const json = backupJSON();
  const done = () => { markBackedUp(); backupSay('Copied ✓ — paste it into Notes or a .json file'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(json).then(done).catch(() => showBackupText(json));
  } else showBackupText(json);
}
function showBackupText(json) {
  backupSay(`Select all and copy:<textarea readonly style="width:100%;min-height:140px;margin-top:6px;font:11px monospace;border:1px solid var(--border);border-radius:8px;padding:8px" onfocus="this.select()">${esc(json)}</textarea>`);
}

let pendingImport = null;
function importBackup() { const i = document.getElementById('backup-file'); if (i) { i.value = ''; i.click(); } }
function importPicked(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  file.text().then(text => {
    const data = JSON.parse(text);
    if (!Array.isArray(data.molecules) || !Array.isArray(data.formulas)) throw new Error('bad');
    pendingImport = data;
    backupSay(`
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;color:var(--text2);line-height:1.5">
        Replace current data with this backup?<br>
        <b>${data.molecules.length}</b> molecules · <b>${data.formulas.length}</b> formulas${data.accords ? ` · <b>${data.accords.length}</b> accords` : ''}${data.visions ? ` · <b>${data.visions.length}</b> visions` : ''}${data.wishlist ? ` · <b>${data.wishlist.length}</b> in wishlist` : ''}${data.notebook ? ` · <b>${data.notebook.length}</b> notes` : ''}
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="pendingImport=null;backupSay('')">Cancel</button>
          <button class="btn btn-danger" style="flex:1" onclick="confirmImport()">Replace</button>
        </div>
      </div>`);
  }).catch(() => backupSay('This file isn’t a Lab backup (.json)'));
}
function confirmImport() {
  const data = pendingImport; if (!data) return;
  state.molecules = data.molecules;
  state.formulas  = data.formulas;
  state.families  = data.families || [];
  if (data.accords) state.accords = data.accords;
  if (data.visions) state.visions = data.visions;
  if (data.wishlist) state.wishlist = data.wishlist;
  if (data.notebook) state.notebook = data.notebook;
  if (data.extraNotes && typeof data.extraNotes === 'object') { addNotesToBase(Object.keys(data.extraNotes), data.extraNotes); }
  pendingImport = null;
  save(); closeSheet(); render();
  toast(`Imported: ${data.molecules.length} molecules, ${data.formulas.length} formulas`);
}

function openBackupSheet() {
  const molCount  = state.molecules.length;
  const formCount = state.formulas.length;
  const lastSaved = (() => {
    try {
      const raw = localStorage.getItem('mara_mols_v3');
      return raw ? 'In browser storage' : 'Nothing saved';

  })();

  showSheet('backup', 'Backup & Restore', `
    <div class="form-body">
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px 16px">

          <div>

            <div style="font-size:11px;color:var(--text3)">formulas</div>
          </div>
          <div>
            <div style="font-size:22px;font-weight:600">${(state.accords||[]).length}</div>
            <div style="font-size:11px;color:var(--text3)">accords</div>
          </div>
          <div>
            <div style="font-size:22px;font-weight:600">${(state.visions||[]).length}</div>
            <div style="font-size:11px;color:var(--text3)">visions</div>
          </div>
          <div>
            <div style="font-size:22px;font-weight:600">${(state.wishlist||[]).length}</div>
            <div style="font-size:11px;color:var(--text3)">wishlist</div>
          </div>
          <div>
            <div style="font-size:22px;font-weight:600">${(state.notebook||[]).length}</div>
            <div style="font-size:11px;color:var(--text3)">notes</div>
          </div>
        </div>
        <div style="margin-top:8px;font-size:11px;color:var(--text3)">${lastBackupText()}</div>
      </div>

      <div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px" onclick="exportBackup()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Save backup (.json)
        </button>
        <div style="font-size:11px;color:var(--text3);margin-top:6px;text-align:center">On iPhone choose “Save to Files” in the menu that opens</div>
        <button class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;margin-top:8px" onclick="copyBackup()">Copy backup text</button>
      </div>

      <div>
        <button class="btn btn-ghost" style="width:100%;justify-content:center;padding:12px" onclick="importBackup()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Import Backup
        </button>
        <input type="file" id="backup-file" accept=".json,application/json,text/plain" style="display:none" onchange="importPicked(this)" />
        <div style="font-size:11px;color:var(--text3);margin-top:6px;text-align:center">⚠ Replaces all current data</div>

        💡 Export a backup regularly — browser storage can be cleared by iOS or if you clear Safari data. Keep the .json file in Files or iCloud.
      </div>
    </div>
  `);
}

  const NOCW = new Set(['molecule', 'log', 'cup', 'smoke', 'wave', 'cloud', 'flame', 'snow', 'vanilla', 'cinnamon', 'staranise', 'honey', 'pastry', 'cookie', 'beans', 'coconut', 'pineapple', 'banana', 'moss', 'needles', 'tree', 'candle', 'paw', 'paper']);
  const PAL = {
    fruit: ['#f49a48', '#e0364a', '#f8c040', '#b84a8a', '#9cc040', '#f07a5a'],
    flower: ['#f28ab4', '#b48ee0', '#f6c648', '#ea5a6a', '#7e9ae8', '#fbe0ea', '#f4a078'],

    'Білі квіти': [['star', 'flower5', 'blossom'], ['#fffaf0', '#fff6e0', '#fdf0f4']],
    'Зелені, трав’яні та фужерні': [['sprig', 'leaf', 'grass'], PAL.green],
    'Прянощі': [['seeds', 'corns', 'root'], PAL.spice],

    'Напої': [['tumbler', 'glass', 'wine'], PAL.drink],

  const PLANT = new Set(['Цитрусові', 'Фрукти, овочі та горіхи', 'Квіти', 'Білі квіти', 'Зелені, трав’яні та фужерні']);
  const hash = s => { let h = 7; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; };
  const cache = new Map();

  function pick(name, cat) {
    const n = name.toLowerCase(), h = hash(n);
    const latin = /^[\x20-\x7e™®]+$/.test(name);
    let ing = null;

    if (/^гвоздик/.test(n)) ing = cat === 'Квіти' ? [0, 'flower5', '#ea5a7e', '#fff0b0'] : [0, 'clove', '#7a4a2c'];
    if (!ing) {
      const plant = PLANT.has(cat);
      for (const r of I) { if (r[0] === 'MATERIALS') { if (plant) break; continue; } if (r[0].test(n)) { ing = r; break; } }
    }
    let tpl = ing && ing[1], a = ing && ing[2], b = ing && ing[3];
    const form = F.find(r => r[0].test(n));
    if (form && tpl !== 'molecule' && !(form[1] === 'blossom' && ['rose', 'star', 'daisy', 'flower5', 'bell', 'spike', 'tulip', 'pompon'].includes(tpl)) && !(form[1] === tpl)) {
      const keepDrink = ['cup', 'glass', 'wine', 'tumbler'].includes(tpl) && ['tumbler', 'glass', 'cup'].includes(form[1]);
      if (!keepDrink) {
        const hadColour = !!a;
        tpl = form[1]; b = undefined;
        if (tpl === 'blossom' && /^квіт/.test(n)) {
          const fl = ['flower5', 'daisy', 'star', 'blossom', 'tulip', 'bell'];
          tpl = fl[h % fl.length];
          a = hadColour ? (lum(a) > .8 ? a : lt(a, .35)) : (cat === 'Білі квіти' ? '#fffaf0' : PAL.flower[(h >>> 3) % PAL.flower.length]);
        } else if (tpl === 'blossom' && !hadColour) a = cat === 'Білі квіти' ? '#fffaf0' : ['#fbd0dc', '#fffaf0', '#f8c0d4', '#fde8b8'][(h >>> 3) % 4];
        else if (form[3] || !a) a = form[2] || a;
        else if (form[1] === 'blossom') a = lum(a) > .8 ? a : lt(a, .62);
      }
    }
    if (!tpl) {
      const fb = FB[cat] || FB['Поза категоріями'];
      tpl = (latin && /синтетичні|Мускус|Поза/.test(cat || '')) && !/ /.test(name) ? 'molecule' : fb[0][h % fb[0].length];
      a = tpl === 'tree' ? '#4e9a4a' : fb[1][(h >>> 3) % fb[1].length];
    }
    if (!a) a = PAL.misc[h % PAL.misc.length];
    if (!NOCW.has(tpl)) { const cw = CW.find(r => r[0].test(n)); if (cw && !(tpl === 'tumbler' && b === 'milk')) { a = cw[1]; if (tpl === 'citrus') b = undefined; } }
    return { tpl, a, b };
  }

  function art(name, cat) {
    const key = name + '|' + (cat || '');
    let r = cache.get(key);
    if (r) return r;
    const { tpl, a, b } = pick(name, cat);
    const light = lum(a) > 0.82;
    const base = (tpl === 'cup' || tpl === 'glass' || tpl === 'tumbler' || tpl === 'wine') && light ? '#c8dce6' : a;
    r = {
      tpl,
      svg: `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${T[tpl](a, b)}</svg>`,
      bg: light ? '#e6ebe0' : mix(base, '#ffffff', 0.84),
      fg: light ? '#7a8470' : mix(base, '#000000', lum(base) > 0.6 ? 0.38 : 0.12),
    };
    cache.set(key, r);
    return r;
  }
  return { art, pick, T };
})();

// ── Picture pack: images imported on this device (IndexedDB), never part of the app file ──
const PACK = { map: {}, count: 0 };
function packDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('mara_lab', 2);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('notePack')) db.createObjectStore('notePack');
      if (!db.objectStoreNames.contains('visPhotos')) db.createObjectStore('visPhotos');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function packLoad() {
  try {
    const db = await packDB();
    const st = db.transaction('notePack').objectStore('notePack');
    const [keys, vals] = await Promise.all([st.getAllKeys(), st.getAll()].map(q => new Promise(r => { q.onsuccess = () => r(q.result); q.onerror = () => r([]); })));
    PACK.map = {}; keys.forEach((k, i) => PACK.map[k] = vals[i]);
    PACK.count = keys.filter(k => k[0] !== '~').length;
    if (PACK.count) render();
  } catch (e) {}
}
function packNormKey(x) { return String(x).toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ''); }
let PACK_INDEX = null;
// notes that share a name (e.g. "Лайм" twice, "Зацукрований Лимон"/"лимон") take files "Name", "Name_2", …
function packMatch(fileBase, taken) {
  if (!PACK_INDEX) { PACK_INDEX = {}; for (const n of ALL_NOTES_FLAT) (PACK_INDEX[packNormKey(n)] = PACK_INDEX[packNormKey(n)] || []).push(n); }
  const list = PACK_INDEX[packNormKey(fileBase)] || PACK_INDEX[packNormKey(fileBase.replace(/_\d+$/, ''))];
  if (!list) return null;
  return list.find(n => !taken[n]) || null;
}
function loadJSZip() {
  if (window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    sc.onload = () => res(window.JSZip); sc.onerror = () => rej(new Error('jszip'));
    document.head.appendChild(sc);
  });
}
function openPackSheet() {
  showSheet('pack', 'Picture pack', `
    <div class="form-body">
      <p style="font-size:13px;color:var(--text2);line-height:1.5;margin:0">
        Import a .zip of note pictures — each file named after its note (e.g. <i>Апельсин.jpg</i>).
        They are saved only in this browser on this device and show instead of the drawn icons.
      </p>
      <div style="font-size:13px" id="pack-status">${PACK.count ? `<b>${PACK.count}</b> pictures imported` : 'No pack imported yet'}</div>
      <button class="btn btn-primary" style="justify-content:center" onclick="document.getElementById('pack-input').click()">Import .zip</button>
      <input type="file" id="pack-input" accept=".zip,application/zip,application/x-zip-compressed" style="display:none" onchange="packImport(this)" />
      ${PACK.count ? `<button class="btn btn-ghost" style="justify-content:center" onclick="packClear()">Remove pack</button>` : ''}
    </div>

async function packImport(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const st = document.getElementById('pack-status');
  const say = t => { if (st) st.innerHTML = t; };
  try {
    say('Reading…');
    const JSZip = await loadJSZip();
    const zip = await JSZip.loadAsync(file);
    const entries = Object.values(zip.files).filter(f => !f.dir && /\.(png|jpe?g|webp|gif)$/i.test(f.name) && !/(^|\/)\./.test(f.name))
      .sort((a, b) => a.name.localeCompare(b.name));
    const mime = n => /\.png$/i.test(n) ? 'image/png' : /\.webp$/i.test(n) ? 'image/webp' : /\.gif$/i.test(n) ? 'image/gif' : 'image/jpeg';
    const out = {}; let skipped = 0, i = 0;
    for (const f of entries) {
      const base = f.name.split('/').pop().replace(/\.[^.]+$/, '');
      const note = packMatch(base, out);
      if (!note) { skipped++; out['~' + packNormKey(base.replace(/_\d+$/, ''))] = `data:${mime(f.name)};base64,` + await f.async('base64'); continue; }
      out[note] = `data:${mime(f.name)};base64,` + await f.async('base64');
      if (++i % 100 === 0) say(`Importing… ${i}`);
    }
    const db = await packDB();
    await new Promise((res, rej) => {
      const tx = db.transaction('notePack', 'readwrite'), os = tx.objectStore('notePack');
      for (const [k, v] of Object.entries(out)) os.put(v, k);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
    Object.assign(PACK.map, out);
    PACK.count = Object.keys(PACK.map).filter(k => k[0] !== '~').length;
    say(`<b>${PACK.count}</b> pictures imported${skipped ? ` · ${skipped} more kept for notes that get added later` : ''}`);
    toast(`Imported ${Object.keys(out).length} pictures`);
    const g = document.getElementById('vis-note-grid'); if (g) g.innerHTML = renderNoteGrid();
    const ag = document.getElementById('acc-note-grid'); if (ag) ag.innerHTML = accGridHTML();
  } catch (e) {
    say('Could not read this file — is it a .zip of images?');
  }
}
async function packClear() {
  try {
    const db = await packDB();
    await new Promise(res => { const tx = db.transaction('notePack', 'readwrite'); tx.objectStore('notePack').clear(); tx.oncomplete = res; tx.onerror = res; });
  } catch (e) {}
  PACK.map = {}; PACK.count = 0;
  closeSheet(); toast('Pack removed');
  const g = document.getElementById('vis-note-grid'); if (g) g.innerHTML = renderNoteGrid();
}

// Check if a note name exists in user's molecule collection (fuzzy match)
function noteInCollection(noteName) {
  if (noteAccords(noteName).length) return true;
  return noteInMolecules(noteName);
}
function noteInMolecules(noteName) {
  const names = [noteName];
  if (NOTE_ALIAS[noteName]) names.push(NOTE_ALIAS[noteName]);
  return state.molecules.some(m => {
    const n = String(m.name||'').toLowerCase().trim();
    if (!n) return false;
    const first = n.split(' ')[0];
    return names.some(x => {
      const q = x.toLowerCase();
      return n.includes(q) || (first.length > 2 && q.includes(first));
    });
  });
}

function visImgPicked(input) {
  const file = input.files && input.files[0];
  const name = visionPickerState.imgTarget;
  if (!file || !name) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const S = 120;
      const c = document.createElement('canvas');
      c.width = S; c.height = S;
      const ctx = c.getContext('2d');
      const k = Math.max(S / img.width, S / img.height);
      const w = img.width * k, h = img.height * k;
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, S, S);
      ctx.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
      const prev = noteImgs[name];
      noteImgs[name] = c.toDataURL('image/jpeg', 0.8);
      if (!saveNoteImgs()) {
        if (prev) noteImgs[name] = prev; else delete noteImgs[name];
        toast('Storage is full — remove some pictures first');
        return;
      }
      const g = document.getElementById('vis-note-grid'); if (g) g.innerHTML = renderNoteGrid();
      if (window._afterPic) { const f = window._afterPic; window._afterPic = null; f(); try { render(); } catch (e) {} }
    };
    img.onerror = () => toast('Could not read this image');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

let wikiImgs = {}, wikiHide = {};

const wikiPending = new Set();
function saveWiki() {
  try { localStorage.setItem('mara_wiki_imgs_v1', JSON.stringify(wikiImgs)); } catch (e) {}
  try { localStorage.setItem('mara_wiki_hide_v1', JSON.stringify(wikiHide)); } catch (e) {}

function wikiTitle(n) {
  let t = n.replace(/\s*\(.*?\)\s*/g, ' ').replace(/[™®]/g, '').trim();
  if (/[а-яіїєґ]/i.test(t)) t = t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
  return t;
}
async function wikiQuery(lang, titleToNames) {
  const titles = Object.keys(titleToNames);
  const found = {};
  for (let i = 0; i < titles.length; i += 50) {
    const chunk = titles.slice(i, i + 50);
    const url = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1` +
      `&prop=pageimages&piprop=thumbnail%7Cname&pithumbsize=160&titles=` + encodeURIComponent(chunk.join('|'));
    const r = await fetch(url);
    if (!r.ok) throw new Error('wiki ' + r.status);
    const j = await r.json();
    const q = j.query || {};
    const back = {};
    for (const t of chunk) back[t] = t;
    for (const x of (q.normalized || [])) if (back[x.from]) back[x.to] = back[x.from];
    for (const x of (q.redirects || [])) if (back[x.from]) back[x.to] = back[x.from];
    for (const p of Object.values(q.pages || {})) {
      const orig = back[p.title];
      if (orig && p.thumbnail && p.thumbnail.source) {
        found[orig] = { u: p.thumbnail.source, f: p.pageimage || '', l: lang, p: p.title };
      }
    }
  }
  return found;
}
async function wikiLoad(names) {
  const todo = names.filter(n => !(n in wikiImgs) && !wikiPending.has(n));
  if (!todo.length) return;
  todo.forEach(n => wikiPending.add(n));
  try {
    const uk = {};
    for (const n of todo) { const t = wikiTitle(n); (uk[t] = uk[t] || []).push(n); }
    const fUk = await wikiQuery('uk', uk);
    const en = {};
    for (const [t, ns] of Object.entries(uk)) {
      if (fUk[t]) { ns.forEach(n => wikiImgs[n] = fUk[t]); continue; }
      for (const n of ns) {
        const alt = NOTE_ALIAS[n] || (/^[\x20-\x7e]+$/.test(n) ? wikiTitle(n) : '');
        if (alt) (en[alt.replace(/\s*\(.*?\)\s*/g, ' ').trim()] = en[alt.replace(/\s*\(.*?\)\s*/g, ' ').trim()] || []).push(n);
        else wikiImgs[n] = 0;
      }
    }
    if (Object.keys(en).length) {
      const fEn = await wikiQuery('en', en);
      for (const [t, ns] of Object.entries(en)) ns.forEach(n => wikiImgs[n] = fEn[t] || 0);
    }
    saveWiki();
    const g = document.getElementById('vis-note-grid');
    if (g) g.innerHTML = renderNoteGrid(true);
  } catch (e) {
    // offline or blocked — try again next time
  } finally {
    todo.forEach(n => wikiPending.delete(n));
  }
}

function noteMolecules(n) {
  const k = noteKey(n);
  const names = [k, NOTE_ALIAS[k]].filter(Boolean).map(x => x.toLowerCase());
  return state.molecules.filter(m => {
    const nn = String(m.name || '').toLowerCase().trim();
    if (!nn) return false;
    const first = nn.split(' ')[0];
    return names.some(q => nn.includes(q) || (first.length > 2 && q.includes(first)));
  });
}
function visionToFormula(visId) {
  const vis = state.visions.find(v => v.id === visId);
  if (!vis) return;
  const items = [], missing = [], used = new Set();
  for (const n of vis.notes || []) {
    const acc = noteAccords(n.name)[0];
    if (acc) {
      if (!used.has(acc.id)) { used.add(acc.id); items.push({ ing: { accId: acc.id, name: acc.name, family: 'Accord', pct: 0, dilPct: 100 }, tier: n.pyramid || 'Heart' }); }
      continue;
    }
    const mol = noteMolecules(n.name).find(m => !used.has(m.id));
    if (mol) {
      used.add(mol.id);
      items.push({ ing: { molId: mol.id, name: mol.name, family: mol.family, pct: 0, dilPct: 100 }, tier: n.pyramid || mol.pyramid || 'Heart' });
    } else missing.push(noteKey(n.name));
  }
  if (!items.length) { toast('None of these notes are in your molecules or accords yet'); return; }
  // starting proportions: Top 20 · Heart 35 · Base 45, split evenly inside each tier
  const W = { Top: 20, Heart: 35, Base: 45 };
  const tiers = {};
  items.forEach(x => { const t = W[x.tier] ? x.tier : 'Heart'; x.tier = t; (tiers[t] = tiers[t] || []).push(x); });
  const wSum = Object.keys(tiers).reduce((s, t) => s + W[t], 0);
  Object.entries(tiers).forEach(([t, arr]) => arr.forEach(x => x.ing.pct = +(W[t] / wSum * 100 / arr.length).toFixed(4)));
  closeSheet();
  showPage('formulas');
  openFormulaBuilder(null, 'formulas');
  BS.name = vis.name;
  BS.visionId = vis.id;
  BS.notes = `From vision “${vis.name}”.` + (missing.length ? ` Not covered yet: ${missing.join(', ')}.` : '');
  BS.versions[0].ingredients = items.map(x => x.ing);
  renderBuilder();
  toast(`${items.length} ingredients added — adjust the %`);
}
function missingToWishlist(visId) {
  const vis = state.visions.find(v => v.id === visId);
  if (!vis) return;
  let added = 0;
  for (const n of vis.notes || []) if (!noteInCollection(n.name) && wishAdd(noteKey(n.name), { fromNote: noteKey(n.name), silent: true })) added++;
  toast(added ? `${added} added to wishlist` : 'Already in wishlist');
}

let MK = null;
function openMakeSheet(id, kind) {
  const f = (state[kind] || []).find(x => x.id === id);
  if (!f) return;
  const v = f.versions[f.activeVersion || 0];
  const eth = +v.ethanolMl || 0, conc = +v.totalMl || 0;
  MK = { id, kind, mode: 'grams', grams: conc || 2, bottle: 30,
         strength: eth > 0 && conc > 0 ? Math.round(conc / (conc + eth) * 100) : 20,
         expand: true, done: {} };
  showSheet('make', 'Make · ' + esc(f.name), `<div id="make-body">${makeBodyHTML()}</div>`);
}
function makeRows() {
  const f = state[MK.kind].find(x => x.id === MK.id);
  const v = f.versions[f.activeVersion || 0];
  const base = MK.expand ? mergeIngs(expandIngs(v.ingredients)) : v.ingredients.map(i => ({ ...i }));
  const total = base.reduce((s, i) => s + (+i.pct || 0), 0) || 1;
  const concG = MK.mode === 'grams' ? (+MK.grams || 0) : (+MK.bottle || 0) * (+MK.strength || 0) / 100;
  let run = 0;
  return { concG, rows: base.map((i, k) => {
    const g = concG * (+i.pct || 0) / total; run += g;
    const mol = i.molId ? state.molecules.find(m => m.id === i.molId) : null;
    let dil = '';
    if ((+i.dilPct || 100) < 100) {
      const d = (mol?.dilutions || []).find(d => typeof d === 'object' && +d.pct === +i.dilPct);
      dil = d?.label || `${i.dilPct}% dilution`;
    }
    return { key: (i.accId || i.molId) + '|' + (i.dilPct || 100) + '|' + k, name: ingDisplayName(i), acc: !!i.accId, g, run, dil };
  }) };
}

// "https://shop.ua/ua/hedione-hc-10-g-p1234.html" → "Hedione HC 10 G"
function nameFromUrl(u) {
  let url; try { url = new URL(String(u).trim()); } catch (e) { return ''; }
  const generic = /^(ua|uk|en|ru|pl|de|product|products|p|item|items|goods|tovar|catalog|catalogue|shop|store|collections?|category|categories|c|dp|gp|index|amp)$/i;
  const segs = url.pathname.split('/').filter(Boolean).map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } })
    .map(x => x.replace(/\.(html?|php|aspx?)$/i, ''))
    .filter(x => /[a-zа-яіїєґ]/i.test(x) && !generic.test(x) && !/^[a-z]{0,2}\d+$/i.test(x) && !/^(?=.*\d)[A-Z0-9]{8,}$/.test(x));
  let seg = segs[segs.length - 1];
  if (!seg) {
    const q = url.searchParams.get('name') || url.searchParams.get('product') || url.searchParams.get('q');
    seg = q || '';
  }
  if (!seg) return url.hostname.replace(/^www\./, '');
  let words = seg.replace(/[-_+.]+/g, ' ').split(/\s+/).filter(Boolean);
  while (words.length > 1 && /^(p|id|sku|art)?\d{3,}$/i.test(words[words.length - 1])) {
    words.pop();
    if (words.length > 1 && /^(p|id|sku|art)$/i.test(words[words.length - 1])) words.pop();
  }
  return words.map(w => /^(hc|eo|fcf|mna|dpg|ipm|tec)$/i.test(w) ? w.toUpperCase()
    : /^(g|г|гр|ml|мл|kg|кг|oz|\d+(g|г|ml|мл|kg|кг))$/i.test(w) ? w.toLowerCase()
    : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}
function linkHost(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
function isUrl(t) { return /^https?:\/\/\S+$/i.test(String(t || '').trim()); }
async function wishPasteLink() {
  let t = '';
  try { t = (await navigator.clipboard.readText()).trim(); } catch (e) {}
  if (!isUrl(t)) { openWishForm(null, ''); toast('Paste the link into the Link field'); return; }
  if (state.wishlist.some(w => !w.done && w.link === t)) { toast('This link is already in wishlist'); return; }
  openWishForm(null, t);
}

function wishAdd(name, opts) {

  state.wishlist.unshift({ id: uid(), name, note: opts.note || '', price: opts.price || '', link: opts.link || '', fromNote: opts.fromNote || '', done: false, createdAt: Date.now() });
  save();

}

// ══════════════════════════════════════════════════════
let DC = null;
function openDilutionCalc(molId) {
  DC = { molId: molId || '', from: 100, target: 10, by: 'total', amount: 10, solvent: 'DPG' };
  showSheet('dilCalc', 'Dilution calculator', `<div id="dc-body">${dcBodyHTML()}</div>`);
}
function dcBodyHTML() {
  const mol = state.molecules.find(m => m.id === DC.molId);
  const dils = (mol?.dilutions || []).filter(d => typeof d === 'object' && +d.pct > 0 && +d.pct < 100);
  const from = +DC.from || 0, target = +DC.target || 0, amt = +DC.amount || 0;
  let mat = 0, solv = 0, err = '';
  if (!from || !target) err = 'Enter both strengths';
  else if (target > from) err = 'Target must be weaker than what you start from';
  else if (DC.by === 'total') { mat = amt * target / from; solv = amt - mat; }
  else { mat = amt; solv = amt * from / target - amt; }
  const seg = (on, label, js) => `<button class="btn btn-sm${on ? ' btn-primary' : ' btn-ghost'}" onclick="${js}">${label}</button>`;
  return `
    <div class="form-body" style="gap:12px">
      <div class="field"><label>Material <span style="font-weight:400;text-transform:none;color:var(--text3)">optional</span></label>
        <select onchange="dcSet('molId',this.value)">
          <option value="">— any —</option>
          ${state.molecules.slice().sort((a, b) => a.name.localeCompare(b.name)).map(m => `<option value="${m.id}"${m.id === DC.molId ? ' selected' : ''}>${esc(m.name)}</option>`).join('')}
        </select></div>
      <div class="field"><label>Start from</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="mk-chip${+DC.from === 100 ? ' on' : ''}" onclick="dcSet('from',100)">Pure 100%</button>
          ${dils.map(d => `<button class="mk-chip${+DC.from === +d.pct ? ' on' : ''}" onclick="dcSet('from',${+d.pct})">${esc(d.label || d.pct + '%')}</button>`).join('')}
        </div>
        <div class="field-row-2" style="margin-top:8px">
          <div class="field"><label>Start strength %</label><input type="number" inputmode="decimal" step="0.1" value="${DC.from}" onchange="dcSet('from',this.value)" /></div>
          <div class="field"><label>Target %</label><input type="number" inputmode="decimal" step="0.1" value="${DC.target}" onchange="dcSet('target',this.value)" /></div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
          ${[50, 20, 10, 5, 1, 0.1].map(p => `<button class="mk-chip${+DC.target === p ? ' on' : ''}" onclick="dcSet('target',${p})">${p}%</button>`).join('')}
        </div>
      </div>
      <div style="display:flex;gap:6px">${seg(DC.by === 'total', 'I want … g total', "dcSet('by','total')")}${seg(DC.by === 'material', 'I have … g of material', "dcSet('by','material')")}</div>
      <div class="field-row-2">
        <div class="field"><label>${DC.by === 'total' ? 'Total (g)' : 'Material (g)'}</label><input type="number" inputmode="decimal" step="0.1" value="${DC.amount}" onchange="dcSet('amount',this.value)" /></div>
        <div class="field"><label>Solvent</label><input value="${esc(DC.solvent)}" onchange="DC.solvent=this.value;dcRefresh()" /></div>
      </div>
      ${err ? `<div class="ifra-warn warn" style="margin:0"><span>${err}</span></div>` : `
      <div class="mk-summary">
        <div><b>${mat.toFixed(3)} g</b><span>${esc(mol ? mol.name : 'material')}${from < 100 ? ` (${from}%)` : ''}</span></div>
        <div><b>${solv.toFixed(3)} g</b><span>${esc(DC.solvent || 'solvent')}</span></div>
        <div><b>${(mat + solv).toFixed(3)} g</b><span>= ${target}%</span></div>
      </div>`}
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeSheet()">Close</button>
      ${mol && !err ? `<button class="btn btn-primary" onclick="dcSaveToMol()">Save ${target}% to ${esc(mol.name)}</button>` : ''}
    </div>`;
}
function dcRefresh() { const b = document.getElementById('dc-body'); if (b) b.innerHTML = dcBodyHTML(); }
function dcSet(k, val) {
  if (k === 'molId' || k === 'by') DC[k] = val;
  else DC[k] = Math.max(0, parseFloat(String(val).replace(',', '.')) || 0);
  if (k === 'molId') DC.from = 100;
  dcRefresh();
}
function dcSaveToMol() {
  const mol = state.molecules.find(m => m.id === DC.molId); if (!mol) return;
  const pct = +DC.target;
  mol.dilutions = (mol.dilutions || []).filter(d => !(typeof d === 'object' && +d.pct === pct));
  mol.dilutions.push({ label: `${pct}% in ${DC.solvent || 'DPG'}`, pct });
  mol.dilutions.sort((a, b) => (+b.pct || 0) - (+a.pct || 0));
  save(); closeSheet(); toast(`${pct}% dilution saved to ${mol.name}`);
  if (state.page === 'molecules') render();
}

function inClaudeFrame() { try { return window.self !== window.top; } catch (e) { return true; } }
function setupOffline() {
  if (!('serviceWorker' in navigator) || (location.protocol !== 'https:' && location.hostname !== 'localhost') || inClaudeFrame()) return;
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
function setupPersist() {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
}
const BACKUP_KEY = 'lab_last_backup_v1', REMIND_KEY = 'lab_backup_reminded_v1';
function markBackedUp() { try { localStorage.setItem(BACKUP_KEY, String(Date.now())); } catch (e) {} const b = document.getElementById('backup-banner'); if (b) b.remove(); }
function lastBackupAt() { try { return +localStorage.getItem(BACKUP_KEY) || 0; } catch (e) { return 0; } }
function daysAgo(t) { return Math.floor((Date.now() - t) / 86400000); }
function lastBackupText() {
  const t = lastBackupAt();
  if (!t) return 'Never backed up';
  const d = daysAgo(t);
  return 'Last backup: ' + (d === 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago');
}
function backupReminder() {
  const hasData = state.molecules.length + state.formulas.length + (state.accords || []).length + (state.visions || []).length > 0;
  if (!hasData) return;
  const last = lastBackupAt();
  if (last && daysAgo(last) < 7) return;
  let reminded = 0; try { reminded = +localStorage.getItem(REMIND_KEY) || 0; } catch (e) {}
  if (reminded && Date.now() - reminded < 86400000) return;
  if (document.getElementById('backup-banner')) return;
  const el = document.createElement('div');
  el.id = 'backup-banner';
  el.className = 'backup-banner';
  el.innerHTML = `<span>${last ? `No backup for ${daysAgo(last)} days` : 'You haven’t saved a backup yet'}</span>
    <button class="btn btn-primary btn-sm" onclick="openBackupSheet()">Back up</button>
    <button class="backup-banner-x" onclick="try{localStorage.setItem('${REMIND_KEY}',Date.now())}catch(e){};this.parentElement.remove()" aria-label="Later">×</button>`;
  document.body.appendChild(el);
}

const DAY = 86400000;

}

    let score = cos * 6, why = [];
    if (target.family && m.family === target.family) { score += 3; why.push(m.family); }
    if (target.pyramid && m.pyramid === target.pyramid) { score += 1; why.push(m.pyramid); }
    if (shared.length) why.push(shared.slice(0, 3).map(x => SIM_WORD[x] || x).join(', '));
    return { m, score, why };
  }).filter(x => x.score >= (opts.min || 1.6)).sort((a, b) => b.score - a.score).slice(0, opts.limit || 5);
}

const PHOTO_CACHE = {};
async function photoGet(id) {
  if (PHOTO_CACHE[id]) return PHOTO_CACHE[id];
  try {
    const db = await packDB();
    const v = await new Promise(r => { const q = db.transaction('visPhotos').objectStore('visPhotos').get(id); q.onsuccess = () => r(q.result); q.onerror = () => r(null); });
    if (v) PHOTO_CACHE[id] = v;
    return v || null;
  } catch (e) { return null; }
}
async function photoPut(id, data) {
  PHOTO_CACHE[id] = data;
  const db = await packDB();
  await new Promise((res, rej) => { const tx = db.transaction('visPhotos', 'readwrite'); tx.objectStore('visPhotos').put(data, id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
}
async function photoDel(ids) {

// <img data-photo="id"> get their picture after the HTML is on screen
function hydratePhotos() {

function resizeImage(file, max, q) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q));
      };
      im.onerror = rej; im.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
// a few dominant colours of a picture
function paletteFrom(dataUrl, n) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const S = 48, c = document.createElement('canvas'); c.width = S; c.height = S;
      const x = c.getContext('2d'); x.drawImage(im, 0, 0, S, S);
      const d = x.getImageData(0, 0, S, S).data, bins = new Map();
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        const k = (r >> 4) << 8 | (g >> 4) << 4 | (b >> 4);
        const e = bins.get(k) || { n: 0, r: 0, g: 0, b: 0 }; e.n++; e.r += r; e.g += g; e.b += b; bins.set(k, e);
      }
      const cols = [...bins.values()].sort((a, b) => b.n - a.n).map(e => [e.r / e.n, e.g / e.n, e.b / e.n]);
      const out = [];
      for (const col of cols) {
        if (out.every(o => Math.hypot(o[0] - col[0], o[1] - col[1], o[2] - col[2]) > 48)) out.push(col);
        if (out.length >= (n || 5)) break;
      }
      res(out.map(c => '#' + c.map(v => Math.round(v).toString(16).padStart(2, '0')).join('')));
    };
    im.onerror = () => res([]); im.src = dataUrl;
  });
}
function refFromInput(t) {
  t = String(t || '').trim();
  if (!t) return null;
  if (!isUrl(t)) return { id: uid(), title: t, link: '' };
  let title = nameFromUrl(t);
  try {
    const u = new URL(t);
    if (/fragrantica\./.test(u.hostname)) {
      const seg = u.pathname.split('/').filter(Boolean);
      const i = seg.findIndex(s => /^(perfume|parfum|parfem|parfume)$/i.test(s));
      if (i >= 0 && seg[i + 2]) title = (decodeURIComponent(seg[i + 1]) + ' ' + decodeURIComponent(seg[i + 2]).replace(/\.html?$/, '').replace(/-\d+$/, '')).replace(/-/g, ' ');
    }
  } catch (e) {}
  return { id: uid(), title, link: t };
}

// "Hedione 4 g, Iso E Super 2" → [{mol, amount}] — one material per line or comma-separated
function nbAccordLines(text) {
  const parts = String(text || '').split(/\n|;|,(?!\d)/).map(s => s.trim()).filter(Boolean);
  const out = [], seen = new Set();
  for (const p of parts) {
    const m = nbMentions(p)[0];
    if (!m || seen.has(m.id)) continue;
    const rest = p.toLowerCase().replace(m.name.toLowerCase(), ' ');
    const num = rest.match(/(\d+(?:[.,]\d+)?)/);
    seen.add(m.id);
    out.push({ mol: m, amount: num ? parseFloat(num[1].replace(',', '.')) : 1 });
  }

}

  base: /(базов[іi]\s+нот[иa]|базовые\s+ноты|нот[иa]\s+баз[иы]|нот[иa]\s+основи|кінцев[іi]\s+нот[иa]|base\s+notes?)/gi,
};
const PYR_STOP = /(голос|відгук|отзыв|review|схож|similar|стійк|стойк|longevity|шлейф|sillage|rating|рейтинг|fragrantica|реклама|коментар|comment)/i;
let NOTE_MATCH = null;
function noteMatchIndex() {
  if (NOTE_MATCH) return NOTE_MATCH;
  const norm = x => x.toLowerCase().replace(/['`ʼ]/g, '’');
  const list = [];
  for (const n of ALL_NOTES_FLAT) {
    list.push({ k: norm(n), n });
    if (NOTE_ALIAS[n] && NOTE_ALIAS[n] !== n) list.push({ k: norm(NOTE_ALIAS[n]), n });
  }
  list.sort((a, b) => b.k.length - a.k.length);
  return NOTE_MATCH = list;
}
// all notes from the base that appear in a piece of text, in text order
function findNotesIn(text) {
  const t = String(text || '').toLowerCase().replace(/['`ʼ]/g, '’');
  const L = /[\p{L}]/u;
  const taken = new Array(t.length).fill(false), hits = [];
  const free = (a, b) => { for (let i = a; i < b; i++) if (taken[i]) return false; return true; };
  const mark = (a, b, n) => { for (let i = a; i < b; i++) taken[i] = true; hits.push({ at: a, n }); };
  for (const { k, n } of noteMatchIndex()) {
    if (k.length < 3) continue;
    let i = t.indexOf(k);
    while (i >= 0) {
      const e = i + k.length;
      if (!L.test(t[i - 1] || ' ') && !L.test(t[e] || ' ') && free(i, e)) mark(i, e, n);
      i = t.indexOf(k, i + 1);
    }
  }
  // Ukrainian endings: "троянди", "бергамоту" → single-word notes of 5+ letters
  for (const { k, n } of noteMatchIndex()) {
    if (k.length < 5 || /\s/.test(k) || hits.some(h => h.n === n)) continue;
    const stem = k.slice(0, -1).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(^|[^\\p{L}])(' + stem + '\\p{L}{0,3})(?=[^\\p{L}]|$)', 'gu');
    let m;
    while ((m = re.exec(t))) {
      const a = m.index + m[1].length, b = a + m[2].length;
      if (free(a, b)) { mark(a, b, n); break; }
    }
  }
  const seen = new Set();
  return hits.sort((a, b) => a.at - b.at).map(h => h.n).filter(n => !seen.has(n) && seen.add(n));
}
// one listed item ("Шафрану", "Дикі Ягоди") → the note from the base, or the item itself as your own note
function wordsClose(a, b) {
  if (a === b) return true;
  if (a.length < 4 || b.length < 4) return false;
  let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
  return i >= 4 && i >= Math.max(a.length, b.length) - 2;
}
function matchItem(item) {
  const norm = x => x.toLowerCase().replace(/['`ʼ]/g, '’').trim();
  const it = norm(item);
  const idx = noteMatchIndex();
  const exact = idx.find(x => x.k === it); if (exact) return exact.n;
  const w = it.split(/\s+/);
  const close = idx.find(x => { const kw = x.k.split(/\s+/); return kw.length === w.length && kw.every((k, i) => wordsClose(k, w[i])); });
  if (close) return close.n;
  return null;
}
// guess a category for a new note from notes that share a word with it ("Біла Деревина" → woods)
function guessNoteCat(name) {
  const words = name.toLowerCase().split(/\s+/).filter(w => w.length >= 3);
  const votes = {};
  for (const [cat, arr] of Object.entries(FRAG_NOTES)) for (const n of arr)
    for (const w of n.toLowerCase().split(/\s+/)) if (words.some(x => wordsClose(x, w) || (x.length >= 3 && x === w))) votes[cat] = (votes[cat] || 0) + 1;
  const best = Object.entries(votes).sort((a, b) => b[1] - a[1])[0];
  return best ? best[0] : 'Поза категоріями';
}
// add notes that aren't in the base yet; returns how many were added
function addNotesToBase(names, cats = {}) {
  let added = 0;
  for (const raw of names) {
    const n = String(raw || '').trim();
    if (!n || n.length > 40 || knownNote(n)) continue;
    const cat = FRAG_NOTES[cats[n]] ? cats[n] : guessNoteCat(n);
    extraNotes[n] = cat;
    FRAG_NOTES[cat].push(n); FRAG_NOTES[cat].sort((a, b) => a.localeCompare(b, 'uk'));
    NOTE_CAT_OF[n] = cat;
    ALL_NOTES_FLAT.push(n); ALL_NOTES_FLAT.sort((a, b) => a.localeCompare(b, 'uk'));
    added++;
  }
  if (added) { NOTE_MATCH = null; PACK_INDEX = null; saveExtraNotes(); }
  return added;
}
function parseItems(seg) {
  const out = [];
  const items = String(seg).split(/[,;\n•·|]|\s+(?:і|й|та|and|и|&)\s+/i)
    .map(x => x.replace(/^[\s:\-–—.]+|[\s.:!]+$/g, '').trim()).filter(x => /\p{L}/u.test(x));
  for (const item of items) {
    const words = item.split(/\s+/).length;
    if (words > 4 || item.length > 40) { out.push(...findNotesIn(item)); continue; }
    const n = matchItem(item);
    out.push(n || item.charAt(0).toUpperCase() + item.slice(1));
  }
  return out;
}
function parsePyramid(text) {
  text = String(text || '');
  const heads = [];
  for (const [tier, re] of Object.entries(TIER_HEAD)) {
    re.lastIndex = 0; let m;
    while ((m = re.exec(text))) heads.push({ tier, a: m.index, b: m.index + m[0].length });
  }
  heads.sort((x, y) => x.a - y.a);
  const out = { top: [], heart: [], base: [], other: [] };
  const used = new Set();
  const add = (tier, list) => list.forEach(n => { if (!used.has(n)) { used.add(n); out[tier].push(n); } });
  if (!heads.length) { add('other', parseItems(text.replace(/^\s*(ноти|notes|ноты)\s*:/i, ''))); return out; }
  heads.forEach((h, i) => {
    let seg = text.slice(h.b, i + 1 < heads.length ? heads[i + 1].a : h.b + 600);
    const stop = seg.search(PYR_STOP);
    if (stop >= 0) { const nl = seg.lastIndexOf('\n', stop); seg = seg.slice(0, nl >= 0 ? nl : stop); }
    add(h.tier, parseItems(seg));
  });
  return out;
}
function perfNotes(p) { return ['top', 'heart', 'base', 'other'].flatMap(t => (p[t] || []).map(n => ({ n, t }))); }

let PF = null;   // the perfume being added
function openPerfumeSheet(target) {
  const ed = String(target).startsWith('edit:') ? state.visions.find(v => v.id === target.slice(5)) : null;
  PF = { target, link: ed?.link || '', name: ed?.name || '', nameTouched: !!ed, text: '', tiers: ed ? visTiers(ed) : { top: [], heart: [], base: [], other: [] }, addTier: 'top', take: false };
  showSheet('perf', ed ? 'Edit' : 'Add a perfume', `
    <div class="form-body" style="gap:12px">

        <input id="pf-link" type="url" inputmode="url" placeholder="https://www.fragrantica…/perfume/…" autocomplete="off" value="${esc(PF.link)}" oninput="pfLink(this.value)" /></div>
      <div class="field"><label>Name</label><input id="pf-name" placeholder="e.g. Portrait of a Lady" autocomplete="off" value="${esc(PF.name)}" oninput="PF.name=this.value;PF.nameTouched=true" /></div>
      <div class="field"><label>Notes</label>

}
function pfLink(v) {
  PF.link = v.trim();

    const r = refFromInput(PF.link);
    const nm = document.getElementById('pf-name'); if (nm && r) { nm.value = r.title; PF.name = r.title; }
  }
}
async function pfPaste() {
  let t = '';
  try { t = await navigator.clipboard.readText(); } catch (e) {}
  if (!t) { toast('Paste into the Notes field'); document.getElementById('pf-text').focus(); return; }
  if (isUrl(t.trim()) && !document.getElementById('pf-link').value) { document.getElementById('pf-link').value = t.trim(); pfLink(t); return; }

}
let pfTimer = null;
function pfParse(v) {

}
function pfChip(n, tier, removable) {

}
function pfPreviewHTML() {

function pfSuggest(q) {

}
function pfAddNote(n) {
  for (const t of Object.keys(PF.tiers)) PF.tiers[t] = PF.tiers[t].filter(x => x !== n);

function pfRemove(t, n) { PF.tiers[t] = PF.tiers[t].filter(x => x !== n); document.getElementById('pf-preview').innerHTML = pfPreviewHTML(); }
function pfSave() {
  let link = (document.getElementById('pf-link').value || '').trim();

  const firstLine = String(PF.text || '').split('\n').map(x => x.trim()).find(x => x && x.length < 70 && !Object.values(TIER_HEAD).some(re => { re.lastIndex = 0; return re.test(x); }) && !findNotesIn(x).length);

const TIER_PYR = { top: 'Top', heart: 'Heart', base: 'Base', other: '' };
function mergeNotesInto(vis, list) {

    vis.notes.push({ name: n, pyramid: TIER_PYR[t] });

}
function takePerfumeNotes(visId, pid) {
  const vis = state.visions.find(v => v.id === visId); if (!vis) return;
  const p = (vis.perfumes || []).find(x => x.id === pid); if (!p) return;
  const before = (vis.notes || []).length;
  mergeNotesInto(vis, perfNotes(p));

function perfumesViewHTML(vis) {

const PYR_TIER = { Top: 'top', Heart: 'heart', Base: 'base' };

function migrateVisions() {
  let changed = false;

    const ps = v.perfumes || [];
    if (ps.length) {
      changed = true;
      const copy = { ...v }; delete copy.perfumes; out.push(copy);
      ps.forEach(p => out.push({ id: uid(), name: p.name, link: p.link || '', notes: tierNotes({ top: p.top || [], heart: p.heart || [], base: p.base || [], other: p.other || [] }), updatedAt: p.addedAt || Date.now() }));
